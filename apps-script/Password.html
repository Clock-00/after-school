<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
  <form id="password-form">
    <input type="hidden" id="role">
    <p>같은 역할의 이전 비밀번호와 세션은 종료됩니다.</p>
    <label>새 비밀번호 <input id="password" type="password" autocomplete="new-password" minlength="9" maxlength="128" required></label>
    <button type="submit">저장</button>
    <p id="message" role="status"></p>
  </form>
  <script>
    const form = document.getElementById('password-form');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const password = document.getElementById('password');
      const button = form.querySelector('button');
      button.disabled = true;
      google.script.run.withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(error => {
          password.value = '';
          button.disabled = false;
          document.getElementById('message').textContent = error.message;
        })
        .setRolePasswordFromSheet(document.getElementById('role').value, password.value);
    });
  </script>
</body>
</html>
