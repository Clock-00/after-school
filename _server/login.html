<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>백암초 방과후 업무 로그인</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="main">
    <h1>백암초 방과후 업무 로그인</h1>
    <p id="notice" role="status" aria-live="polite"></p>
    <section class="panel" id="sign-in">
      <h2>역할별 로그인</h2>
      <form id="login-form">
        <label>역할
          <select name="role" required>
            <option value="">역할을 선택하세요</option>
            <option value="staff">업무 담당자</option>
            <option value="approver">승인 담당자</option>
            <option value="admin">관리자</option>
          </select>
        </label>
        <label>아이디 <input name="id" autocomplete="username" required></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="secondary-button">로그인</button>
      </form>
    </section>
    <section class="panel" id="account" hidden>
      <h2>내 계정</h2>
      <p id="identity"></p>
      <button class="secondary-button" id="logout">로그아웃</button>
      <h2>권한 확인용 가상 경력</h2>
      <ul id="records"></ul>
    </section>
    <section class="panel" id="admin" hidden>
      <h2>담당자 계정 등록</h2>
      <form id="register-form">
        <label>아이디 <input name="id" maxlength="254" required></label>
        <label>역할
          <select name="role">
            <option value="staff">업무 담당자</option>
            <option value="approver">승인 담당자</option>
          </select>
        </label>
        <label>초기 비밀번호 <input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
        <button class="secondary-button">계정 등록</button>
      </form>
      <h2>사용자 목록</h2>
      <ul id="users"></ul>
    </section>
  </main>
</body>
</html>
